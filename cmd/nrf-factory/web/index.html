<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nRF Factory</title>
  <style>
    :root {
      color-scheme: light;
      --bench: #e7edf2;
      --paper: #f9fbfc;
      --ink: #17232e;
      --muted: #667684;
      --line: #c7d1d9;
      --blue: #2768ce;
      --blue-dark: #174b96;
      --amber: #d78b22;
      --terminal: #111a22;
      --terminal-line: #2a3b49;
      --success: #40d39b;
      --failure: #ff7474;
      --white: #f4f8fb;
      --shadow: 0 24px 70px rgba(32, 52, 68, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--bench);
      background-image: radial-gradient(circle, rgba(41, 75, 101, 0.16) 1px, transparent 1px);
      background-size: 18px 18px;
      font-family: "Avenir Next", Aptos, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    button:focus-visible,
    input:focus-visible,
    .file-drop:focus-within {
      outline: 3px solid rgba(39, 104, 206, 0.35);
      outline-offset: 3px;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto;
      background: var(--paper);
      border: 1px solid rgba(72, 95, 113, 0.28);
      box-shadow: var(--shadow);
    }

    .topbar {
      min-height: 76px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--ink);
      font: 700 14px/1 "SFMono-Regular", Consolas, monospace;
      letter-spacing: -0.08em;
      clip-path: polygon(0 0, 82% 0, 100% 18%, 100% 100%, 18% 100%, 0 82%);
    }

    .brand strong {
      display: block;
      font-family: Bahnschrift, "DIN Alternate", "Arial Narrow", sans-serif;
      font-size: 22px;
      letter-spacing: 0.035em;
    }

    .brand small {
      color: var(--muted);
      font: 600 11px/1.4 "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .tool-status {
      max-width: 48%;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--failure);
      box-shadow: 0 0 0 4px rgba(255, 116, 116, 0.12);
    }

    .tool-status.ready .status-dot {
      background: #13a777;
      box-shadow: 0 0 0 4px rgba(19, 167, 119, 0.12);
    }

    main {
      display: grid;
      grid-template-columns: minmax(340px, 0.88fr) minmax(420px, 1.12fr);
      min-height: 620px;
    }

    .control-panel {
      padding: clamp(28px, 4vw, 54px);
      border-right: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--blue-dark);
      font: 700 11px/1 "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 520px;
      margin: 0;
      font-family: Bahnschrift, "DIN Alternate", "Arial Narrow", sans-serif;
      font-size: clamp(38px, 5.8vw, 66px);
      font-weight: 650;
      line-height: 0.94;
      letter-spacing: -0.045em;
    }

    .lede {
      max-width: 500px;
      margin: 20px 0 32px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font: 700 11px/1 "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .file-drop {
      position: relative;
      min-height: 86px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 15px;
      border: 1px dashed #8ea3b4;
      background: #f1f5f7;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .file-drop:hover {
      border-color: var(--blue);
      background: #edf3fb;
    }

    .file-drop input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .file-tag {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: white;
      background: var(--blue);
      font: 800 11px/1 "SFMono-Regular", Consolas, monospace;
    }

    .file-copy strong {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-copy span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .station-block { margin-top: 28px; }

    .station-rail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line);
      background: #dfe6eb;
    }

    .station {
      min-height: 104px;
      padding: 17px 18px;
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
      align-items: center;
      gap: 0 14px;
      border: 0;
      color: #6c7c88;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .station + .station { border-left: 1px solid var(--line); }

    .station-letter {
      grid-row: 1 / 3;
      font-family: Bahnschrift, "DIN Alternate", "Arial Narrow", sans-serif;
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
    }

    .station-name {
      align-self: end;
      font: 700 10px/1 "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .station-count {
      align-self: start;
      margin-top: 7px;
      color: inherit;
      font: 700 22px/1 "SFMono-Regular", Consolas, monospace;
    }

    .station.active {
      color: white;
      background: var(--blue);
      box-shadow: inset 0 -6px 0 var(--blue-dark);
    }

    .station[data-side="R"].active {
      background: var(--amber);
      box-shadow: inset 0 -6px 0 #a6650e;
    }

    .actions {
      margin-top: 26px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .primary,
    .secondary {
      min-height: 52px;
      border: 0;
      cursor: pointer;
      font-weight: 750;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    .primary {
      color: white;
      background: var(--ink);
      letter-spacing: 0.04em;
    }

    .secondary {
      padding: 0 19px;
      color: var(--ink);
      border: 1px solid var(--line);
      background: transparent;
    }

    .primary:hover:not(:disabled),
    .secondary:hover:not(:disabled) { transform: translateY(-2px); }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .tool-setup {
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .tool-install {
      width: 100%;
      margin-top: 10px;
      min-height: 46px;
    }

    .console-panel {
      min-width: 0;
      display: flex;
      flex-direction: column;
      color: var(--white);
      background: var(--terminal);
    }

    .console-head {
      min-height: 62px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--terminal-line);
    }

    .console-head strong {
      font: 700 12px/1 "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .console-head span {
      color: #8397a7;
      font: 11px/1 "SFMono-Regular", Consolas, monospace;
    }

    .terminal {
      flex: 1;
      min-height: 420px;
      margin: 0;
      padding: 24px;
      overflow: auto;
      color: var(--white);
      background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 100% 26px;
      font: 12px/1.75 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-line { display: block; }
    .log-line::before { content: "> "; color: #607586; }
    .log-line.success { color: var(--success); }
    .log-line.error { color: var(--failure); }

    .console-foot {
      min-height: 48px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--terminal-line);
      color: #8093a2;
      font: 10px/1.4 "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .busy-mark { display: none; color: var(--amber); }
    body.busy .busy-mark { display: inline; }

    @media (max-width: 850px) {
      .shell { width: min(100% - 18px, 680px); margin: 9px auto; }
      .topbar { align-items: flex-start; }
      .tool-status { max-width: 58%; }
      main { grid-template-columns: 1fr; }
      .control-panel { border-right: 0; border-bottom: 1px solid var(--line); }
      .console-panel { min-height: 480px; }
    }

    @media (max-width: 520px) {
      .topbar { display: block; }
      .tool-status { max-width: none; margin-top: 14px; text-align: left; }
      .control-panel { padding: 28px 20px; }
      .station { padding: 14px; gap: 0 9px; }
      .station-letter { font-size: 46px; }
      .actions { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">nF</div>
        <div>
          <strong>nRF Factory</strong>
          <small>Local production flasher</small>
        </div>
      </div>
      <div id="toolStatus" class="tool-status" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="toolMessage">檢查 nRF Util…</span>
      </div>
    </header>

    <main>
      <section class="control-panel" aria-labelledby="pageTitle">
        <p class="eyebrow">Fixture control</p>
        <h1 id="pageTitle">選側、載入、燒錄。</h1>
        <p class="lede">韌體只在本次燒錄期間暫存。選擇 L 或 R，確認檔名後開始作業。</p>

        <label class="label" for="firmware">Firmware</label>
        <label class="file-drop" for="firmware">
          <input id="firmware" name="firmware" type="file" accept=".hex" required>
          <span class="file-tag" aria-hidden="true">HEX</span>
          <span class="file-copy">
            <strong id="fileName">選擇 .hex 韌體</strong>
            <span id="fileHint">檔案不會嵌入程式</span>
          </span>
        </label>

        <div class="station-block">
          <span class="label">Product side</span>
          <div class="station-rail" role="group" aria-label="選擇產品側別">
            <button class="station active" data-side="L" type="button" aria-pressed="true">
              <span class="station-letter">L</span>
              <span class="station-name">Left count</span>
              <span id="leftCount" class="station-count">0</span>
            </button>
            <button class="station" data-side="R" type="button" aria-pressed="false">
              <span class="station-letter">R</span>
              <span class="station-name">Right count</span>
              <span id="rightCount" class="station-count">0</span>
            </button>
          </div>
        </div>

        <div class="actions">
          <button id="flashButton" class="primary" type="button" disabled>開始燒錄 L</button>
          <button id="resetButton" class="secondary" type="button">清除計數</button>
        </div>

        <div class="tool-setup">
          <span class="label">nRF Util</span>
          <label class="file-drop" for="toolFile">
            <input id="toolFile" name="tool" type="file">
            <span class="file-tag" aria-hidden="true">EXE</span>
            <span class="file-copy">
              <strong id="toolFileName">指定 nrfutil 執行檔</strong>
              <span id="toolFileHint">選 nrfutil（Windows 為 nrfutil.exe）；不在 PATH 時用這裡指定</span>
            </span>
          </label>
          <button id="installButton" class="secondary tool-install" type="button">安裝 device 命令</button>
        </div>
      </section>

      <section class="console-panel" aria-labelledby="consoleTitle">
        <div class="console-head">
          <strong id="consoleTitle">燒錄軌跡</strong>
          <span>stdout + stderr</span>
        </div>
        <div id="terminal" class="terminal" role="log" aria-live="polite" aria-relevant="additions">
          <span class="log-line">系統已啟動，等待韌體。</span>
        </div>
        <div class="console-foot">
          <span>Loopback only · firmware removed after run · <span id="appVersion">—</span></span>
          <span class="busy-mark">programming</span>
        </div>
      </section>
    </main>
  </div>

  <script>
    const firmwareInput = document.querySelector("#firmware");
    const fileName = document.querySelector("#fileName");
    const fileHint = document.querySelector("#fileHint");
    const flashButton = document.querySelector("#flashButton");
    const resetButton = document.querySelector("#resetButton");
    const terminal = document.querySelector("#terminal");
    const stations = [...document.querySelectorAll(".station")];
    const toolStatus = document.querySelector("#toolStatus");
    const toolMessage = document.querySelector("#toolMessage");
    const toolFile = document.querySelector("#toolFile");
    const toolFileName = document.querySelector("#toolFileName");
    const installButton = document.querySelector("#installButton");
    let selectedSide = "L";
    let busy = false;
    let serverOnline = false;

    function appendLog(message, level = "info") {
      if (!message) return;
      const line = document.createElement("span");
      line.className = `log-line ${level}`;
      line.textContent = message;
      terminal.append(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    function networkHint(error) {
      const raw = (error && error.message) || String(error || "");
      if (/failed to fetch|networkerror|load failed|network request failed/i.test(raw)) {
        return "連不上本機服務（Failed to fetch）。服務可能已停止（關掉 app 視窗＝停服務）。請重新啟動程式；重開後 port 可能不同，舊視窗會失效，請改用新視窗。";
      }
      return raw || "未知錯誤";
    }

    function markOffline(message) {
      serverOnline = false;
      toolStatus.classList.remove("ready");
      toolMessage.textContent = message || "本機服務已停止";
      // Server-dependent actions must lock offline too, not just flash; setBusy
      // re-applies reset/install disabled state against the new serverOnline.
      setBusy(busy);
    }

    function renderState(state) {
      if (!state) return;
      serverOnline = true;
      document.querySelector("#leftCount").textContent = state.leftCount;
      document.querySelector("#rightCount").textContent = state.rightCount;
      toolStatus.classList.toggle("ready", state.toolReady);
      toolMessage.textContent = state.toolMessage;
      if (state.command && state.command !== "nrfutil") {
        toolFileName.textContent = state.command.split(/[\\/]/).pop();
        const bundled = /(^|[\\/])3rd[\\/]/.test(state.command);
        document.querySelector("#toolFileHint").textContent = bundled ? "使用內附 nrfutil（3rd/）" : state.command;
      }
      const appVersion = document.querySelector("#appVersion");
      if (appVersion) appVersion.textContent = state.version || "—";
      setBusy(state.busy);
    }

    function setBusy(value) {
      busy = value;
      document.body.classList.toggle("busy", busy);
      firmwareInput.disabled = busy;
      resetButton.disabled = busy || !serverOnline;
      toolFile.disabled = busy;
      installButton.disabled = busy || !serverOnline;
      stations.forEach(button => button.disabled = busy);
      refreshFlashButton();
    }

    function refreshFlashButton() {
      flashButton.textContent = busy ? `正在燒錄 ${selectedSide}` : `開始燒錄 ${selectedSide}`;
      flashButton.disabled = busy || !serverOnline || firmwareInput.files.length === 0;
    }

    async function pingServer() {
      const response = await fetch("/api/state", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      renderState(await response.json());
    }

    stations.forEach(button => {
      button.addEventListener("click", () => {
        selectedSide = button.dataset.side;
        stations.forEach(item => {
          const active = item === button;
          item.classList.toggle("active", active);
          item.setAttribute("aria-pressed", String(active));
        });
        refreshFlashButton();
      });
    });

    firmwareInput.addEventListener("change", () => {
      const file = firmwareInput.files[0];
      fileName.textContent = file ? file.name : "選擇 .hex 韌體";
      fileHint.textContent = file ? `${Math.max(1, Math.ceil(file.size / 1024))} KB · 僅本次作業` : "檔案不會嵌入程式";
      refreshFlashButton();
    });

    flashButton.addEventListener("click", async () => {
      const file = firmwareInput.files[0];
      if (!file || busy) return;

      setBusy(true);
      try {
        await pingServer();
      } catch (error) {
        markOffline("本機服務已停止");
        appendLog(networkHint(error), "error");
        setBusy(false);
        return;
      }

      const form = new FormData();
      form.append("side", selectedSide);
      form.append("firmware", file, file.name);

      try {
        const response = await fetch("/api/flash", { method: "POST", body: form });
        if (!response.ok) {
          let message = `HTTP ${response.status}`;
          try {
            const problem = await response.json();
            if (problem.error) message = problem.error;
          } catch (_) { /* non-JSON error body */ }
          throw new Error(message);
        }
        await readEvents(response.body);
      } catch (error) {
        appendLog(networkHint(error), "error");
        try {
          await pingServer();
        } catch (_) {
          markOffline("本機服務已停止");
        }
      } finally {
        setBusy(false);
      }
    });

    resetButton.addEventListener("click", async () => {
      try {
        const response = await fetch("/api/reset", { method: "POST" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
        renderState(result);
        appendLog("L/R 成功計數已清除");
      } catch (error) {
        appendLog(networkHint(error), "error");
        try {
          await pingServer();
        } catch (_) {
          markOffline("本機服務已停止");
        }
      }
    });

    toolFile.addEventListener("change", async () => {
      const file = toolFile.files[0];
      if (!file || busy) return;
      toolFileName.textContent = file.name;
      appendLog(`指定 nrfutil：${file.name}，驗證中…`);
      setBusy(true);

      const form = new FormData();
      form.append("tool", file, file.name);
      try {
        const response = await fetch("/api/tool", { method: "POST", body: form });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
        renderState(result);
        appendLog(result.toolReady ? `工具就緒：${result.toolMessage}` : `仍缺：${result.toolMessage}`, result.toolReady ? "success" : "error");
      } catch (error) {
        appendLog(networkHint(error), "error");
        try {
          await pingServer();
        } catch (_) {
          markOffline("本機服務已停止");
        }
      } finally {
        setBusy(false);
      }
    });

    installButton.addEventListener("click", async () => {
      if (busy) return;
      appendLog("開始安裝 nrfutil device 命令…（下載需一點時間）");
      setBusy(true);
      try {
        const response = await fetch("/api/install-device", { method: "POST" });
        if (!response.ok) {
          let message = `HTTP ${response.status}`;
          try {
            const problem = await response.json();
            if (problem.error) message = problem.error;
          } catch (_) { /* non-JSON error body */ }
          throw new Error(message);
        }
        await readEvents(response.body);
      } catch (error) {
        appendLog(networkHint(error), "error");
        try {
          await pingServer();
        } catch (_) {
          markOffline("本機服務已停止");
        }
      } finally {
        setBusy(false);
      }
    });

    async function readEvents(body) {
      const reader = body.getReader();
      const decoder = new TextDecoder();
      let pending = "";

      while (true) {
        const { value, done } = await reader.read();
        pending += decoder.decode(value || new Uint8Array(), { stream: !done });
        const lines = pending.split("\n");
        pending = lines.pop();
        for (const line of lines) handleEvent(line);
        if (done) break;
      }
      if (pending.trim()) handleEvent(pending);
    }

    function handleEvent(line) {
      if (!line.trim()) return;
      const event = JSON.parse(line);
      appendLog(event.message, event.level);
      if (event.state) renderState(event.state);
    }

    async function loadState() {
      try {
        await pingServer();
      } catch (error) {
        markOffline("無法連線本機服務");
        appendLog(networkHint(error), "error");
      }
    }

    loadState();
    // Stale green status after the Go process dies is confusing; poll while idle.
    setInterval(() => {
      if (busy) return;
      pingServer().catch(() => markOffline("本機服務已停止 — 請重新啟動程式"));
    }, 3000);
  </script>
</body>
</html>
