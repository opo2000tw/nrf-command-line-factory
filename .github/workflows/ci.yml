name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          # Stdlib-only module (no go.sum); default cache would warn and no-op.
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: cross build
        run: make dist

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: install deps
        run: npm ci
      - name: install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: playwright test
        run: npx playwright test
